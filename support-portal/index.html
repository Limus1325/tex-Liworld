<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090812"><title>LIworld Support — Staff</title><link rel="stylesheet" href="style.css"></head><body>
<div class="ambient"></div><main class="wrap">
<section class="login card" id="loginPanel"><div class="logo"><b>LI</b> LI<span>world</span></div><div class="eyebrow">ЗАКРЫТАЯ ЗОНА СОТРУДНИКОВ</div><h1>Панель поддержки</h1><p>Вход только для авторизованных сотрудников LIworld.</p>
<form id="loginForm"><label>Email сотрудника<input id="email" type="email" autocomplete="username" required placeholder="staff@liworld..."></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••••"></label><button class="button" type="submit">Войти в панель</button><div class="error" id="loginError" aria-live="polite"></div></form><small>Нет регистрации для игроков. Доступ выдаёт только администратор LIworld.</small></section>
<section class="dashboard card hidden" id="dashboard"><div class="dashhead"><div><div class="eyebrow">LIWORLD / STAFF</div><h1>Обращения</h1><p id="who"></p></div><button class="ghost" id="logout">Выйти</button></div><div class="toolbar"><button class="tab active" data-filter="all">Все</button><button class="tab" data-filter="open">Открытые</button><button class="tab" data-filter="closed">Закрытые</button></div><div id="ticketList" class="tickets"><p class="muted">Загрузка обращений…</p></div></section>
</main><script type="module" src="app.js"></script></body></html>
